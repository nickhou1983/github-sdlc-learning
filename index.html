<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Agentic SDLC · CIO Presentations</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #081525;
      --panel: #10243a;
      --line: #28435f;
      --text: #e8f1f8;
      --muted: #a8bed0;
      --cyan: #38bdf8;
      --teal: #2dd4bf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, .18), transparent 32rem),
        radial-gradient(circle at 85% 85%, rgba(45, 212, 191, .14), transparent 28rem),
        var(--navy);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(960px, 100%); }
    .eyebrow {
      color: var(--teal);
      font: 700 .78rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { max-width: 760px; margin: 14px 0 12px; font-size: clamp(2.2rem, 6vw, 4.8rem); line-height: .98; }
    .intro { max-width: 680px; margin: 0 0 34px; color: var(--muted); font-size: 1.1rem; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
    a {
      display: block; padding: 24px; color: inherit; text-decoration: none;
      background: linear-gradient(145deg, rgba(16, 36, 58, .96), rgba(11, 27, 45, .96));
      border: 1px solid var(--line); border-radius: 18px;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    a:hover { transform: translateY(-4px); border-color: var(--cyan); box-shadow: 0 16px 40px rgba(0, 0, 0, .25); }
    .tag { color: var(--cyan); font: 700 .75rem/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    h2 { margin: 14px 0 8px; font-size: 1.35rem; }
    p { margin: 0; color: var(--muted); line-height: 1.55; }
    footer { margin-top: 30px; color: #7590a6; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">GitHub Agentic SDLC · CIO Edition</div>
    <h1>从代码助手到软件工程操作系统</h1>
    <p class="intro">选择一个版本开始浏览。演讲版适合现场分享；深度阅读版保留完整架构、机制与附录细节。</p>
    <section class="grid" aria-label="Presentation editions">
      <a href="github-agentic-sdlc-cio-keynote.html">
        <div class="tag">KEYNOTE · 27 SLIDES</div>
        <h2>CIO 演讲版</h2>
        <p>低密度、强视觉、适合现场演讲，包含附录 A–F。</p>
      </a>
      <a href="github-agentic-sdlc-cio-deck.html">
        <div class="tag">DEEP READING EDITION</div>
        <h2>深度阅读版</h2>
        <p>完整呈现平台能力、Agent 编排、统一上下文与工程实践。</p>
      </a>
    </section>
    <footer>Published with GitHub Pages · nickhou1983/github-sdlc-learning</footer>
  </main>
</body>
</html>
